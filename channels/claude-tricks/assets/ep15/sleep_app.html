              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) =&gt; value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) =&gt; {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest(&quot;a&quot;);
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith(&quot;blob-request:&quot;)) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) =&gt; {
              realParent.postMessage({
                type: &quot;downloadFile&quot;,
                filename: linkEl.download,
                data,
                mimeType: blob.type || &quot;application/octet-stream&quot;,
              });
            });
          } else if (linkEl.href.startsWith(&quot;data:&quot;)) {
            const [header, base64Data] = linkEl.href.split(&quot;,&quot;);
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : &quot;application/octet-stream&quot;;
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =&gt;
              c.charCodeAt(0),
            ).buffer;
            realParent.postMessage({
              type: &quot;downloadFile&quot;,
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            realParent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          realParent.postMessage({
            type: &quot;openExternal&quot;,
            href: url,
          }, &quot;*&quot;);
        };

        window.addEventListener('error', (event) =&gt; {
          realParent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();

&lt;body id=&quot;artifacts-component-root-html&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;h1&gt;🌙 Sleep Tracker&lt;/h1&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;div class=&quot;field&quot;&gt;
        &lt;label&gt;Bedtime&lt;/label&gt;
        &lt;input type=&quot;time&quot; id=&quot;bedtime&quot; value=&quot;22:30&quot;&gt;
      &lt;/div&gt;
      &lt;div class=&quot;field&quot;&gt;
        &lt;label&gt;Wake time&lt;/label&gt;
        &lt;input type=&quot;time&quot; id=&quot;waketime&quot; value=&quot;06:30&quot;&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;log&quot; id=&quot;logBtn&quot;&gt;LOG SLEEP&lt;/button&gt;
    &lt;div class=&quot;result&quot; id=&quot;result&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;chart-title&quot;&gt;Last 7 nights&lt;/div&gt;
    &lt;div id=&quot;chartArea&quot; class=&quot;loading&quot;&gt;Loading…&lt;/div&gt;
    &lt;div class=&quot;avg&quot; id=&quot;avgRow&quot; style=&quot;display:none;&quot;&gt;
      &lt;span&gt;7-day avg&lt;/span&gt;
      &lt;span&gt;&lt;b id=&quot;avgVal&quot;&gt;–&lt;/b&gt; hrs&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const KEY = 'sleep:entries';
const bedtimeEl = document.getElementById('bedtime');
const waketimeEl = document.getElementById('waketime');
const logBtn = document.getElementById('logBtn');
const resultEl = document.getElementById('result');
const chartArea = document.getElementById('chartArea');
const avgRow = document.getElementById('avgRow');
const avgVal = document.getElementById('avgVal');

function todayStr(d = new Date()){
  return d.toISOString().slice(0,10);
}

function dayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return ['S','M','T','W','T','F','S'][d.getDay()];
}

async function loadEntries(){
  try{
    const res = await window.storage.get(KEY);
    return res &amp;&amp; res.value ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}

async function saveEntries(entries){
  await window.storage.set(KEY, JSON.stringify(entries));
}

function computeHours(bedtime, wake){
  const [bh, bm] = bedtime.split(':').map(Number);
  const [wh, wm] = wake.split(':').map(Number);
  let bedMinutes = bh * 60 + bm;
  let wakeMinutes = wh * 60 + wm;
  if (wakeMinutes &lt;= bedMinutes){
    wakeMinutes += 24 * 60;
  }
  return +((wakeMinutes - bedMinutes) / 60).toFixed(1);
}

async function renderChart(){
  const entries = await loadEntries();
  const map = {};
  entries.forEach(e =&gt; map[e.date] = e);

  const days = [];
  for(let i = 6; i &gt;= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(todayStr(d));
  }

  const maxHours = Math.max(9, ...days.map(d =&gt; (map[d] ? map[d].hours : 0)));
  const bars = days.map(date =&gt; {
    const entry = map[date];
    const hours = entry ? entry.hours : 0;
    const pct = entry ? Math.max(6, (hours / maxHours) * 100) : 4;
    const isToday = date === todayStr();
    return `
      &lt;div class=&quot;bar-col ${isToday ? 'today' : ''}&quot;&gt;
        &lt;div class=&quot;bar-hours&quot;&gt;${entry ? hours : ''}&lt;/div&gt;
        &lt;div class=&quot;bar ${entry ? 'has-data' : ''}&quot; style=&quot;height:${pct}%&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;bar-label&quot;&gt;${dayLabel(date)}&lt;/div&gt;
      &lt;/div&gt;`;
  }).join('');

  chartArea.outerHTML = `&lt;div class=&quot;bars&quot; id=&quot;chartArea&quot;&gt;${bars}&lt;/div&gt;`;

  const loggedDays = days.filter(d =&gt; map[d]);
  if(loggedDays.length){
    const avg = loggedDays.reduce((s,d) =&gt; s + map[d].hours, 0) / loggedDays.length;
    avgVal.textContent = avg.toFixed(1);
    avgRow.style.display = 'flex';
  }
}

logBtn.addEventListener('click', async () =&gt; {
  const bedtime = bedtimeEl.value;
  const wake = waketimeEl.value;
  if(!bedtime || !wake){
    resultEl.textContent = 'Set both times first.';
    return;
  }
  logBtn.disabled = true;
  logBtn.textContent = 'LOGGING…';

  const hours = computeHours(bedtime, wake);
  const date = todayStr();

  try{
    const entries = await loadEntries();
    const filtered = entries.filter(e =&gt; e.date !== date);
    filtered.push({ date, bedtime, wake, hours });
    filtered.sort((a,b) =&gt; a.date.localeCompare(b.date));
    const trimmed = filtered.slice(-30);
    await saveEntries(trimmed);

    resultEl.innerHTML = `Logged: &lt;b&gt;${hours} hrs&lt;/b&gt; sleep`;
    await renderChart();
  }catch(e){
    resultEl.textContent = 'Could not save. Try again.';
  }finally{
    logBtn.disabled = false;
    logBtn.textContent = 'LOG SLEEP';
  }
});

renderChart();
&lt;/script&gt;
&lt;/body&gt;
